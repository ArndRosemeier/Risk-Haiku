<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Risk — Hero Edition</title>
  <script type="module" crossorigin src="/assets/index-BdxfGIv4.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DhRnaErq.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">RISK <span>· hero edition</span></div>
    <div class="turnline" id="turnline"></div>
    <div class="controls">
      <button id="btn-new">New game</button>
      <button id="btn-save">Save</button>
      <button id="btn-load">Load</button>
    </div>
  </header>

  <main class="layout">
    <section class="mapwrap">
      <svg id="map" viewBox="0 0 100 92" preserveAspectRatio="xMidYMid meet" aria-label="World map"></svg>
      <div class="banner" id="banner" hidden></div>
    </section>

    <aside class="panel">
      <div class="phase" id="phase"></div>
      <div class="hint" id="hint"></div>

      <div class="card" id="actions"></div>

      <div class="card">
        <h3>Players</h3>
        <ul id="players" class="players"></ul>
      </div>

      <div class="card">
        <h3>Battle</h3>
        <div id="battle" class="battle">No battle yet.</div>
      </div>

      <div class="card log-card">
        <h3>Chronicle</h3>
        <ol id="log" class="log"></ol>
      </div>
    </aside>
  </main>

</body>
</html>
